services:
    db:
        image: postgres:16
        container_name: tabletop
        restart: unless-stopped
        environment:
            POSTGRES_USER: tabletop
            POSTGRES_PASSWORD: tabletop
            POSTGRES_DB: tabletop
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
